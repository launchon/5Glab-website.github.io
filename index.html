<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>时隙配置模拟 - 智能符号填充与子帧高亮</title>
    <link rel="stylesheet" href="styles/common.css">
    <style>
        /* 全局样式增强 */
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 50px 1fr;
            gap: 20px;
            height: calc(100vh - 40px);
        }

        .title-card {
            grid-column: 1 / -1;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 0 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            color: rgb(255, 255, 255);
            display: flex;
            align-items: center;
        }

        .title-card h1 {
            margin: 0;
            font-size: 20px;
        }

        .main-content {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
        }

        .calculator {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .header {
            color: #2c3e50;
            padding: 5px;
            margin-bottom: 20px;
        }

        .header h2 {
            margin: 0 0 10px 0;
            font-size: 16px;
        }

        .main-content h3 {
            margin: 10px 0 5px 0;
            font-size: 14px;
        }

        .config-area label {
            color: #2c3e50;
            font-size: 14px;
        }

        .config-area {
            display: flex;
            gap: 20px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        select {
            background-color: white;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            padding: 5px 10px;
            color: #2c3e50;
            font-size: 13px;
        }

        .timeline {
            background: rgba(251, 252, 252, 0.8);
            border: 1px solid rgba(189, 195, 199, 0.5);
            height: 40px;
            margin: 8px 0;
            position: relative;
            display: flex;
            align-items: center;
            padding: 0;
            overflow: hidden;
            border-radius: 10px;
        }

        /* 子帧选中高亮样式 - 满足第二点需求 */
        .subframe-block {
            height: 100%;
            background-color: #cb68fc;
            border-right: 1px solid #fff;
            transition: all 0.2s ease;
            cursor: pointer;
            box-sizing: border-box;
        }

        .subframe-block.selected {
            background: linear-gradient(135deg, #fbffbe, #f9f09a);
            box-shadow: 0 0 0 2px #ffd966, inset 0 1px 2px rgba(255, 255, 255, 0.4);
            transform: scale(1.01);
            border-radius: 6px;
            position: relative;
            z-index: 2;
        }

        .subframe-block:hover {
            filter: brightness(0.95);
            border-left: 2px solid gold;
        }

        .resource-pool {
            background: rgba(236, 240, 241, 0.8);
            border: 1px solid rgba(189, 195, 199, 0.5);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            gap: 10px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .block {
            width: 90px;
            height: 25px;
            cursor: move;
            display: inline-block;
            margin: 3px;
            position: relative;
            box-sizing: border-box;
            font-size: 12px;
            line-height: 25px;
            text-align: center;
            border-radius: 6px;
            user-select: none;
        }

        .downlink-time {
            background-color: #2196F3;
            color: white;
        }

        .uplink-time {
            background-color: #99cc66;
            color: #1e3c1a;
        }

        .flexible-time {
            background-color: #ffa500;
            color: white;
        }

        .downlink-symbol {
            background-color: #2196F3;
            color: white;
        }

        .uplink-symbol {
            background-color: #99cc66;
            color: #1e3c1a;
        }

        .gp-symbol {
            background-color: #FFFFFF;
            border: 1px solid #333;
            color: #333;
        }

        .symbol-slot {
            flex: 1;
            height: 100%;
            margin: 0 1px;
            border: 1px dashed #bbb;
            background-color: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-sizing: border-box;
            transition: background 0.1s;
        }

        .symbol-slot.drag-over {
            background-color: #e0f0ff;
        }

        .symbol-slot .block {
            width: 100%;
            height: 100%;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: default;
        }

        /* 禁用样式提示 */
        .symbol-slot.disabled-slot {
            background-color: #e2e2e2;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .config-complete-button {
            padding: 10px 20px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .config-complete-button:hover {
            background-color: #2ecc71;
        }

        .calculator h2 {
            font-size: 16px;
            margin: 0 0 10px 0;
        }

        .result-panel {
            border: 2px solid #3498db;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
        }

        .toast-message {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #ffd966;
            padding: 10px 20px;
            border-radius: 30px;
            z-index: 2000;
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="nav-buttons">
        <a href="index.html" class="nav-button active">时隙配置</a>
        <a href="deploy.html" class="nav-button">站点部署</a>
        <a href="login.html" class="nav-button">退出登录</a>
    </div>
    <div class="container">
        <div class="title-card">
            <h1>时隙配置模拟</h1>
            <span id="currentStationId" style="margin-left:30px;font-size:16px;color:#2c3e50;"></span>
        </div>

        <div class="main-content">
            <div class="header">
                <h2>时隙配置模拟器</h2>
                <div class="config-area">
                    <div><label>单无线帧内子帧数：</label><select id="subframeCount" disabled>
                            <option value="10" selected>10</option>
                        </select></div>
                    <div><label>子帧内时隙数：</label><select id="slotCount" disabled>
                            <option value="1" selected>1</option>
                        </select></div>
                    <div><label>上行符号数（每时隙）：</label><span id="uplinkSymbolsAuto"
                            style="font-weight:bold;color:#27ae60;">0</span></div>
                    <div><label>下行符号数（每时隙）：</label><span id="downlinkSymbolsAuto"
                            style="font-weight:bold;color:#2196F3;">0</span></div>
                </div>
            </div>

            <div>
                <h3>子帧 (点击子帧切换，高亮为当前选中)</h3>
                <div class="timeline" id="subframe-timeline"></div>

                <h3>时隙 (拖拽“上行时隙/下行时隙/灵活时隙”至此)</h3>
                <div class="timeline" id="slot-timeline" ondrop="dropSlot(event)" ondragover="allowDrop(event)"></div>

                <h3>符号（单时隙固定14符号）<span id="symbolStatusNote"
                        style="font-size:12px; color:#e67e22; margin-left:12px;"></span></h3>
                <div class="timeline" id="symbol-timeline" style="display:flex; gap:2px;"></div>
            </div>

            <h3>资源池</h3>
            <div class="resource-pool">
                <div class="block downlink-time" draggable="true" ondragstart="drag(event)" data-type="downlink-time">
                    下行时隙</div>
                <div class="block uplink-time" draggable="true" ondragstart="drag(event)" data-type="uplink-time">上行时隙
                </div>
                <div class="block flexible-time" draggable="true" ondragstart="drag(event)" data-type="flexible-time">
                    灵活时隙</div>
                <div class="block downlink-symbol" draggable="true" ondragstart="drag(event)"
                    data-type="downlink-symbol">下行符号</div>
                <div class="block uplink-symbol" draggable="true" ondragstart="drag(event)" data-type="uplink-symbol">
                    上行符号</div>
                <div class="block gp-symbol" draggable="true" ondragstart="drag(event)" data-type="gp-symbol">GP符号</div>
            </div>

            <div style="margin-top: 24px; text-align: right;">
                <button id="configCompleteButton" class="config-complete-button" onclick="saveAndReturn()">配置完毕</button>
            </div>
        </div>

        <div class="calculator">
            <h2 class="section-title">5G NR TBS 计算器</h2>

            <div class="input-section">
                <div class="input-group">
                    <label class="input-label">
                        MCS Index（调制编码策略指数）
                        <input type="number" class="input-field" value="17" id="mcs-number">
                    </label>
                </div>

                <div class="input-group">
                    <label class="input-label">
                        子载波参数μ
                        <select class="input-field" id="subcarrier-mu">
                            <option value="0">μ=0 (15kHz)</option>
                            <option value="1">μ=1 (30kHz)</option>
                            <option value="2">μ=2 (60kHz)</option>
                            <option value="3">μ=3 (120kHz)</option>
                            <option value="4">μ=4 (240kHz)</option>
                            <option value="5">μ=5 (480kHz)</option>
                        </select>
                    </label>
                </div>

                <div class="input-group">
                    <label class="input-label">
                        v(μ)Layers (maximum number of MIMO layers)
                        <input type="number" class="input-field" value="1" min="1" max="8" id="mimo-layers">
                    </label>
                </div>

                <div class="input-group">
                    <label class="input-label">
                        Nprb (Total number of allocated PRBs for the UE)
                        <input type="number" class="input-field" value="15" min="1" max="273" id="nprb">
                    </label>
                </div>

                <div class="input-group">
                    <label class="input-label">
                        N sh symb (时隙中分配给PDSCH/PUSCH的符号数)
                        <input type="number" class="input-field" id="scheduled-symbols" readonly
                            style="background:#f0f0f0;">
                    </label>
                </div>

                <div class="input-group">
                    <label class="input-label">
                        N prb dmrs (PRB中用于DMRS的RE数)
                        <input type="number" class="input-field" value="12" min="0" id="dmrs-per-prb">
                    </label>
                </div>

                <div class="input-group">
                    <label class="input-label">
                        N prb oh （PDSCH开销）
                        <input type="number" class="input-field" value="0" min="0" id="overhead">
                    </label>
                </div>

                <div class="input-group">
                    <label class="input-label">
                        Qm （调制阶数）
                        <input type="number" class="input-field" value="6" id="modulation-order">
                    </label>
                </div>

                <div class="input-group">
                    <label class="input-label">
                        R （目标码率）
                        <input type="number" class="input-field" value="438" id="code-rate">
                    </label>
                </div>
                <div class="result-panel"
                    style="border: 2px solid #3498db; background-color: rgba(255, 255, 255, 0.9); border-radius: 10px; padding: 15px; margin-top: 20px;">
                    <h3 style="color: #2c3e50; margin-bottom: 10px;">计算结果</h3>
                    <div class="result-item">
                        N(RE): <span class="result-value" id="nre-result">0</span>
                    </div>
                    <div class="result-item">
                        Ninfo (信息位数): <span class="result-value" id="ninfo-result">0</span>
                    </div>
                    <div class="result-item">
                        5G NR TBS (传输块大小): <span class="result-value" id="tbs-result">0</span>
                    </div>
                    <div class="result-item">
                        计算的最大吞吐量 (Mbps): <span class="result-value" id="throughput-result">0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ---------- 全局数据结构 ----------
        let subframeConfigs = Array(10).fill(null).map(() => ({ slotType: '', symbolConfig: Array(14).fill('') }));
        let currentSubframeIndex = 0;

        // DOM 元素
        const subframeTimeline = document.getElementById('subframe-timeline');
        const slotTimeline = document.getElementById('slot-timeline');
        const symbolTimeline = document.getElementById('symbol-timeline');
        const uplinkSymbolSpan = document.getElementById('uplinkSymbolsAuto');
        const downlinkSymbolSpan = document.getElementById('downlinkSymbolsAuto');
        const symbolStatusNote = document.getElementById('symbolStatusNote');

        // ---------- 辅助函数 ----------
        function allowDrop(e) { e.preventDefault(); }
        function drag(e) { e.dataTransfer.setData("text", e.target.getAttribute('data-type')); }
        function showMessage(msg, isError = false) {
            let div = document.getElementById('dynamicToast');
            if (!div) { div = document.createElement('div'); div.id = 'dynamicToast'; div.className = 'toast-message'; document.body.appendChild(div); }
            div.textContent = msg;
            div.style.backgroundColor = isError ? '#c0392b' : '#2c3e50';
            div.style.opacity = '1';
            setTimeout(() => div.style.opacity = '0', 2200);
        }

        // 获取当前时隙类型 (从时隙时间轴)
        function getCurrentSlotType() {
            const slotBlock = slotTimeline.querySelector('.block');
            if (!slotBlock) return '';
            if (slotBlock.classList.contains('downlink-time')) return 'downlink-time';
            if (slotBlock.classList.contains('uplink-time')) return 'uplink-time';
            if (slotBlock.classList.contains('flexible-time')) return 'flexible-time';
            return '';
        }

        // 更新符号计数 & TBS联动
        function updateSymbolCount() {
            const slots = document.querySelectorAll('#symbol-timeline .symbol-slot');
            let uplink = 0, downlink = 0;
            slots.forEach(slot => {
                const block = slot.querySelector('.block');
                if (block) {
                    if (block.classList.contains('uplink-symbol')) uplink++;
                    if (block.classList.contains('downlink-symbol')) downlink++;
                }
            });
            uplinkSymbolSpan.textContent = uplink;
            downlinkSymbolSpan.textContent = downlink;
            const scheduledInput = document.getElementById('scheduled-symbols');
            if (scheduledInput) { scheduledInput.value = uplink + downlink; updateResults(); }
        }

        // 从DOM读取当前符号配置 (返回长度为14的数组)
        function getCurrentSymbolConfigFromDOM() {
            const slots = document.querySelectorAll('#symbol-timeline .symbol-slot');
            const config = [];
            slots.forEach(slot => {
                const block = slot.querySelector('.block');
                if (!block) config.push('');
                else if (block.classList.contains('downlink-symbol')) config.push('downlink-symbol');
                else if (block.classList.contains('uplink-symbol')) config.push('uplink-symbol');
                else if (block.classList.contains('gp-symbol')) config.push('gp-symbol');
                else config.push('');
            });
            return config;
        }

        // 保存当前子帧配置 (智能处理上下行强制全符号)
        function saveCurrentSubframeConfig() {
            const slotType = getCurrentSlotType();
            let symbolConfig = [];
            if (slotType === 'downlink-time') {
                symbolConfig = Array(14).fill('downlink-symbol');
            } else if (slotType === 'uplink-time') {
                symbolConfig = Array(14).fill('uplink-symbol');
            } else if (slotType === 'flexible-time') {
                symbolConfig = getCurrentSymbolConfigFromDOM();
            } else {
                symbolConfig = Array(14).fill('');
            }
            subframeConfigs[currentSubframeIndex] = { slotType, symbolConfig };
        }

        // 重建符号时间轴 (完全根据配置和可编辑性构建)
        function rebuildSymbolTimeline(symbolConfigArray, editable) {
            symbolTimeline.innerHTML = '';
            for (let i = 0; i < 14; i++) {
                const slotDiv = document.createElement('div');
                slotDiv.className = 'symbol-slot';
                if (!editable) slotDiv.classList.add('disabled-slot');
                slotDiv.setAttribute('data-index', i);
                // 拖拽放置事件: 仅当 editable 且 当前时隙为灵活时隙时允许 (在drop中二次检查)
                slotDiv.addEventListener('dragover', allowDrop);
                slotDiv.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const currentSlotTypeGlobal = getCurrentSlotType();
                    if (!editable || currentSlotTypeGlobal !== 'flexible-time') {
                        showMessage('当前时隙非灵活时隙，无法配置符号！只有灵活时隙允许调整符号', true);
                        return;
                    }
                    const data = e.dataTransfer.getData("text");
                    if (!['downlink-symbol', 'uplink-symbol', 'gp-symbol'].includes(data)) return;
                    // 清空当前槽位并放置新符号
                    slotDiv.innerHTML = '';
                    const symbolDiv = createSymbolBlock(data);
                    slotDiv.appendChild(symbolDiv);
                    // 更新配置存储
                    const newConfig = getCurrentSymbolConfigFromDOM();
                    subframeConfigs[currentSubframeIndex].symbolConfig = newConfig;
                    updateSymbolCount();
                });
                // 根据配置填充内容
                const symbolType = symbolConfigArray[i];
                if (symbolType) {
                    const symbolDiv = createSymbolBlock(symbolType, editable);
                    slotDiv.appendChild(symbolDiv);
                }
                symbolTimeline.appendChild(slotDiv);
            }
            updateSymbolCount();
        }

        // 创建符号块 (右键删除仅当可编辑+灵活时隙)
        function createSymbolBlock(type, isEditableContext = true) {
            const div = document.createElement('div');
            div.className = `block ${type}`;
            if (type === 'downlink-symbol') div.textContent = '下行';
            else if (type === 'uplink-symbol') div.textContent = '上行';
            else if (type === 'gp-symbol') div.textContent = 'GP';
            div.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                const parentSlot = div.parentElement;
                const currentSlotType = getCurrentSlotType();
                if (currentSlotType !== 'flexible-time') {
                    showMessage('非灵活时隙，符号不可删除/修改', true);
                    return;
                }
                if (parentSlot && parentSlot.classList.contains('symbol-slot') && confirm('删除该符号配置？')) {
                    parentSlot.innerHTML = '';
                    const newCfg = getCurrentSymbolConfigFromDOM();
                    subframeConfigs[currentSubframeIndex].symbolConfig = newCfg;
                    updateSymbolCount();
                }
            });
            return div;
        }

        // 加载子帧配置 (完全根据slotType重建UI)
        function loadSubframeConfig(index) {
            const cfg = subframeConfigs[index];
            const slotType = cfg.slotType;
            // 1. 重建时隙区域
            slotTimeline.innerHTML = '';
            if (slotType) {
                const slotBlock = document.createElement('div');
                slotBlock.className = `block ${slotType}`;
                slotBlock.style.width = '100%';
                if (slotType === 'downlink-time') slotBlock.textContent = '下行';
                else if (slotType === 'uplink-time') slotBlock.textContent = '上行';
                else if (slotType === 'flexible-time') slotBlock.textContent = '灵活';
                slotBlock.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    if (confirm('删除时隙配置？删除后符号将清空并不可编辑')) {
                        slotTimeline.innerHTML = '';
                        subframeConfigs[currentSubframeIndex] = { slotType: '', symbolConfig: Array(14).fill('') };
                        loadSubframeConfig(currentSubframeIndex);
                    }
                });
                slotTimeline.appendChild(slotBlock);
            }
            // 2. 根据时隙类型决定符号轴构建模式
            let editableFlag = (slotType === 'flexible-time');
            let symbolArray = [];
            if (slotType === 'downlink-time') {
                symbolArray = Array(14).fill('downlink-symbol');
                symbolStatusNote.innerText = '🔒 当前子帧为【下行时隙】, 符号固定全下行，不可编辑';
            } else if (slotType === 'uplink-time') {
                symbolArray = Array(14).fill('uplink-symbol');
                symbolStatusNote.innerText = '🔒 当前子帧为【上行时隙】, 符号固定全上行，不可编辑';
            } else if (slotType === 'flexible-time') {
                symbolArray = cfg.symbolConfig && cfg.symbolConfig.length === 14 ? cfg.symbolConfig : Array(14).fill('');
                symbolStatusNote.innerText = '✏️ 灵活时隙，可拖拽符号自由配置 (右键删除符号)';
            } else {
                symbolArray = Array(14).fill('');
                symbolStatusNote.innerText = '⬅️ 请先拖拽时隙类型 (灵活时隙才可配置符号)';
                editableFlag = false;
            }
            rebuildSymbolTimeline(symbolArray, editableFlag);
        }

        // 保存当前再加载新子帧 (切换时调用)
        function selectSubframe(index) {
            if (currentSubframeIndex === index && subframeTimeline.querySelector('.subframe-block.selected')) return;
            saveCurrentSubframeConfig();         // 保存旧子帧配置
            currentSubframeIndex = index;
            // 更新子帧高亮样式
            const allSubBlocks = document.querySelectorAll('#subframe-timeline .subframe-block');
            allSubBlocks.forEach((block, idx) => {
                if (idx === index) block.classList.add('selected');
                else block.classList.remove('selected');
            });
            loadSubframeConfig(index);
        }

        // 初始化子帧时间轴
        function updateTimelines() {
            const subframeCount = 10;
            subframeTimeline.innerHTML = '';
            for (let i = 0; i < subframeCount; i++) {
                const block = document.createElement('div');
                block.className = 'subframe-block';
                block.style.width = `${100 / subframeCount}%`;
                block.style.height = '100%';
                block.style.float = 'left';
                block.setAttribute('data-subframe-index', i);
                block.addEventListener('click', (function (idx) { return function () { selectSubframe(idx); }; })(i));
                subframeTimeline.appendChild(block);
            }
            // 加载第0个子帧
            selectSubframe(0);
        }

        // 拖拽时隙到 slot-timeline 核心（智能填充或置空符号）
        window.dropSlot = function (ev) {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text");
            const targetTimeline = ev.target.closest('.timeline');
            if (!targetTimeline || targetTimeline.id !== 'slot-timeline') return;
            const allowedSlotTypes = ['downlink-time', 'uplink-time', 'flexible-time'];
            if (!allowedSlotTypes.includes(data)) {
                showMessage('请拖拽“下行时隙/上行时隙/灵活时隙”至时隙区域', true);
                return;
            }
            // 保存当前配置
            saveCurrentSubframeConfig();
            const newSlotType = data;
            // 更新当前子帧的时隙类型
            subframeConfigs[currentSubframeIndex].slotType = newSlotType;
            // 如果是下行/上行时隙：自动填充全符号配置
            if (newSlotType === 'downlink-time') {
                subframeConfigs[currentSubframeIndex].symbolConfig = Array(14).fill('downlink-symbol');
                showMessage('下行时隙已部署，符号时间轴自动填充全下行符号（不可修改）');
            } else if (newSlotType === 'uplink-time') {
                subframeConfigs[currentSubframeIndex].symbolConfig = Array(14).fill('uplink-symbol');
                showMessage('上行时隙已部署，符号时间轴自动填充全上行符号（不可修改）');
            } else if (newSlotType === 'flexible-time') {
                // 灵活时隙: 保留原有符号配置（若无则全部清空待配置）
                const existingCfg = subframeConfigs[currentSubframeIndex].symbolConfig;
                if (!existingCfg || existingCfg.every(s => s === '')) {
                    subframeConfigs[currentSubframeIndex].symbolConfig = Array(14).fill('');
                }
                showMessage('灵活时隙已部署，可自由拖拽符号进行配置');
            }
            // 重新加载当前子帧刷新UI
            loadSubframeConfig(currentSubframeIndex);
        };

        // ------------- TBS计算逻辑 -------------
        function updateResults() {
            const mcsIndex = parseInt(document.getElementById('mcs-number').value);
            const subcarrierMu = parseInt(document.getElementById('subcarrier-mu').value);
            const nprb = parseInt(document.getElementById('nprb').value);
            const scheduledSymbols = parseInt(document.getElementById('scheduled-symbols').value) || 0;
            const dmrsPerPrb = parseInt(document.getElementById('dmrs-per-prb').value);
            const overhead = parseInt(document.getElementById('overhead').value);
            const mimolayers = parseInt(document.getElementById('mimo-layers').value);
            const mcsTable = [{ Qm: 2, R: 120 }, { Qm: 2, R: 193 }, { Qm: 2, R: 308 }, { Qm: 2, R: 449 }, { Qm: 2, R: 602 }, { Qm: 2, R: 378 }, { Qm: 2, R: 490 }, { Qm: 2, R: 616 }, { Qm: 2, R: 466 }, { Qm: 2, R: 567 }, { Qm: 4, R: 438 }, { Qm: 4, R: 466 }, { Qm: 4, R: 567 }, { Qm: 4, R: 616 }, { Qm: 6, R: 666 }, { Qm: 6, R: 719 }, { Qm: 6, R: 772 }, { Qm: 6, R: 822 }, { Qm: 6, R: 873 }, { Qm: 6, R: 910 }, { Qm: 8, R: 948 }];
            let Qm = 6, R = 438;
            if (mcsIndex >= 0 && mcsIndex < mcsTable.length) { Qm = mcsTable[mcsIndex].Qm; R = mcsTable[mcsIndex].R; }
            document.getElementById('modulation-order').value = Qm;
            document.getElementById('code-rate').value = R;
            const nRE1 = scheduledSymbols * 12 - overhead - dmrsPerPrb;
            const nRE = Math.min(156, nRE1) * nprb;
            document.getElementById('nre-result').textContent = nRE;
            const ninfo = nRE * (R / 1024) * Qm;
            document.getElementById('ninfo-result').textContent = ninfo.toFixed(4);
            let tbs;
            if (ninfo <= 3824) {
                const n = Math.max(3, Math.floor(Math.log2(ninfo) - 6));
                const ninfo1 = Math.max(24, Math.pow(2, n) * Math.floor(ninfo / Math.pow(2, n)));
                const tbs_table = [24, 32, 40, 48, 56, 64, 72, 80, 88, 96, 104, 112, 120, 128, 136, 144, 152, 160, 168, 176, 184, 192, 208, 240, 256, 272, 280, 304, 320, 336, 352, 368, 384, 408, 432, 456, 480, 504, 528, 552, 576, 608, 640, 672, 704, 736, 768, 808, 848, 928, 984, 1032, 1064, 1128, 1160, 1192, 1224, 1256, 1288, 1320, 1352, 1416, 1480, 1544, 1608, 1672, 1736, 1800, 1864, 1928, 2024, 2088, 2152, 2216, 2280, 2408, 2472, 2536, 2600, 2664, 2728, 2792, 2856, 2976, 3104, 3240, 3368, 3496, 3624, 3752, 3824];
                tbs = 24;
                for (let val of tbs_table) { if (ninfo1 >= val) tbs = val; else break; }
            } else {
                const n = Math.floor(Math.log2(ninfo - 24)) - 5;
                const ninfo1 = Math.max(3824, Math.pow(2, n) * Math.round((ninfo - 24) / Math.pow(2, n)));
                if (R <= 256) { const C = Math.floor((ninfo + 24) / 3816); tbs = 8 * C * Math.ceil((ninfo + 24) / (8 * C)); }
                else { if (ninfo > 8424) { const C = Math.floor((ninfo + 24) / 8424); tbs = 8 * C * Math.ceil((ninfo + 24) / (8 * C)); } else { tbs = 8 * Math.ceil((ninfo + 24) / 8) - 24; } }
            }
            document.getElementById('tbs-result').textContent = tbs;
            const throughput = mimolayers * Math.pow(2, subcarrierMu) * tbs * 1000 / 1024 / 1024;
            document.getElementById('throughput-result').textContent = throughput.toFixed(3);
        }

        // 保存整体配置到localStorage
        function saveAndReturn() {
            saveCurrentSubframeConfig();
            const selectedStationId = localStorage.getItem('selectedStationId');
            if (!selectedStationId) { alert('未找到选中的基站！'); return; }
            const uplinkSymbols = parseInt(uplinkSymbolSpan.textContent);
            const downlinkSymbols = parseInt(downlinkSymbolSpan.textContent);
            const subframeCount = 10;
            const slotCount = 1;
            // 收集所有子帧的时隙配置 (简化只存储每个子帧的类型)
            const slotConfigPerSubframe = subframeConfigs.map(cfg => {
                if (cfg.slotType === 'downlink-time') return 'downlink';
                if (cfg.slotType === 'uplink-time') return 'uplink';
                if (cfg.slotType === 'flexible-time') return 'flexible';
                return '';
            });
            const symbolConfigPerSubframe = subframeConfigs.map(cfg => cfg.symbolConfig);
            try {
                let stationsConfig = JSON.parse(localStorage.getItem('stationsConfig') || '[]');
                const stationIndex = stationsConfig.findIndex(s => s.id === selectedStationId);
                const newStationData = {
                    id: selectedStationId,
                    symbolRatio: { uplink: uplinkSymbols, downlink: downlinkSymbols },
                    subframeCount, slotCount,
                    slotConfig: slotConfigPerSubframe,
                    symbolConfig: symbolConfigPerSubframe,
                    lastUpdated: new Date().toISOString()
                };
                if (stationIndex !== -1) stationsConfig[stationIndex] = { ...stationsConfig[stationIndex], ...newStationData };
                else stationsConfig.push(newStationData);
                localStorage.setItem('stationsConfig', JSON.stringify(stationsConfig));
                showMessage('配置已保存，即将跳转部署页面');
                setTimeout(() => window.location.replace('./deploy.html'), 500);
            } catch (e) { alert('保存失败'); }
        }

        // 监听输入框的变化
        function bindCalcEvents() {
            document.querySelectorAll('.input-field, select, #scheduled-symbols').forEach(el => {
                if (el.id !== 'scheduled-symbols') el.addEventListener('input', updateResults);
                else el.addEventListener('change', updateResults);
            });
        }

        // 页面启动
        document.addEventListener('DOMContentLoaded', () => {
            updateTimelines();
            bindCalcEvents();
            updateResults();
            const stationId = localStorage.getItem('selectedStationId');
            if (stationId) document.getElementById('currentStationId').innerText = '当前配置基站ID：' + stationId;
           
            const savedConfigRaw = localStorage.getItem('stationsConfig');
            if (savedConfigRaw && stationId) {
                const all = JSON.parse(savedConfigRaw);
                const myConf = all.find(s => s.id === stationId);
                if (myConf && myConf.slotConfig && myConf.slotConfig.length === 10) {
                    for (let i = 0; i < 10; i++) {
                        let slotTypeMap = '';
                        if (myConf.slotConfig[i] === 'downlink') slotTypeMap = 'downlink-time';
                        else if (myConf.slotConfig[i] === 'uplink') slotTypeMap = 'uplink-time';
                        else if (myConf.slotConfig[i] === 'flexible') slotTypeMap = 'flexible-time';
                        let symCfg = (myConf.symbolConfig && myConf.symbolConfig[i]) ? myConf.symbolConfig[i] : Array(14).fill('');
                        subframeConfigs[i] = { slotType: slotTypeMap, symbolConfig: symCfg };
                    }
                    selectSubframe(currentSubframeIndex);
                }
            }
        });
    </script>
</body>
