<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>时隙配置模拟</title>
    <link rel="stylesheet" href="styles/common.css">
    <style>
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 50px 1fr;
            gap: 20px;
            height: calc(100vh - 40px);
        }

        .title-card {
            grid-column: 1 / -1;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 0 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            color: white;
            display: flex;
            align-items: center;
        }

        .title-card h1 {
            margin: 0;
            font-size: 20px;
        }

        .main-content {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
        }

        .calculator {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .header {
            color: #2c3e50;
            padding: 5px;
            margin-bottom: 20px;
        }

        .header h2 {
            margin: 0 0 10px 0;
            font-size: 16px;
        }

        .main-content h3 {
            margin: 10px 0 5px 0;
            font-size: 14px;
        }

        .config-area label {
            color: #2c3e50;
            font-size: 14px;
        }

        .config-area {
            display: flex;
            gap: 20px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        select {
            background-color: white;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            padding: 5px 10px;
            color: #2c3e50;
            font-size: 13px;
        }

        select:focus {
            outline: none;
            border-color: #3498db;
        }

        .timeline {
            background: rgba(236, 240, 241, 0.8);
            border: 1px solid rgba(189, 195, 199, 0.5);
            height: 45px;
            margin: 8px 0;
            position: relative;
            display: flex;
            align-items: center;
            padding: 0;
            overflow: hidden;
            border-radius: 10px;
        }

        .timeline-divider {
            position: absolute;
            height: 100%;
            width: 1px;
            background-color: #95a5a6;
            border-left: 1px dashed #95a5a6;
            pointer-events: none;
        }

        .resource-pool {
            background: rgba(236, 240, 241, 0.8);
            border: 1px solid rgba(189, 195, 199, 0.5);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            gap: 10px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .block {
            width: 90px;
            height: 25px;
            cursor: move;
            display: inline-block;
            margin: 3px;
            position: relative;
            box-sizing: border-box;
            font-size: 12px;
            line-height: 25px;
            text-align: center;
        }

        .downlink-time {
            background-color: #ffff66;
        }

        .uplink-time {
            background-color: #ff6666;
        }

        .guard-time {
            background-color: #FFFFFF;
            border: 1px solid #a66a6a;
        }

        .downlink-symbol {
            background-color: #2196F3;
            color: white;
        }

        .uplink-symbol {
            background-color: #99cc66;
        }

        .gp-symbol {
            background-color: #FFFFFF;
            border: 1px solid #000;
        }

        .subframe-block {
            height: 100%;
            background-color: #cb68fc;
            border-right: 1px solid #ccc;
        }

        .timeline .block {
            margin: 0;
            height: 100%;
            flex: none;
        }

        .calculator h2 {
            font-size: 16px;
            margin: 0 0 10px 0;
        }

        .calculator p {
            font-size: 14px;
            margin: 0;
        }

        .config-complete-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .config-complete-button:hover {
            background-color: #2ecc71;
        }

        .config-complete-button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        /* 固定符号槽位样式 */
        .symbol-slot {
            flex: 1;
            height: 100%;
            margin: 0 1px;
            border: 1px dashed #bbb;
            background-color: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-sizing: border-box;
        }
        .symbol-slot .block {
            width: 100%;
            height: 100%;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: default;
        }
    </style>
</head>
<body>
    <div class="nav-buttons">
        <a href="index.html" class="nav-button active">时隙配置</a>
        <a href="deploy.html" class="nav-button">站点部署</a>
        <a href="login.html" class="nav-button">退出登录</a>
    </div>
    <div class="container">
        <div class="title-card">
            <h1>时隙配置模拟</h1>
            <span id="currentStationId" style="margin-left:30px;font-size:16px;color:#2c3e50;"></span>
        </div>

        <div class="main-content">
            <div class="header">
                <h2>时隙配置模拟器</h2>
                <div class="config-area">
                    <div>
                        <label>单无线帧内子帧数：</label>
                        <select id="subframeCount" onchange="updateTimelines()">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                        </select>
                    </div>
                    <div>
                        <label>子帧内时隙数：</label>
                        <select id="slotCount" onchange="updateTimelines()">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="4">4</option>
                            <option value="8">8</option>
                            <option value="16">16</option>
                        </select>
                    </div>
                    <div>
                        <label>上行符号数（每时隙）：</label>
                        <span id="uplinkSymbolsAuto" style="font-weight:bold;color:#27ae60;">0</span>
                    </div>
                    <div>
                        <label>下行符号数（每时隙）：</label>
                        <span id="downlinkSymbolsAuto" style="font-weight:bold;color:#2196F3;">0</span>
                    </div>
                </div>
            </div>

            <div>
                <h3>子帧</h3>
                <div class="timeline" id="subframe-timeline"></div>

                <h3>时隙</h3>
                <div class="timeline" id="slot-timeline" ondrop="dropSlot(event)" ondragover="allowDrop(event)"></div>

                <h3>符号（单时隙固定14符号，拖拽填充）</h3>
                <div class="timeline" id="symbol-timeline" style="display:flex; gap:2px;"></div>
            </div>

            <h3>资源池</h3>
            <div class="resource-pool">
                <div class="block downlink-time" draggable="true" ondragstart="drag(event)" data-type="downlink-time">下行时隙</div>
                <div class="block uplink-time" draggable="true" ondragstart="drag(event)" data-type="uplink-time">上行时隙</div>
                <div class="block downlink-symbol" draggable="true" ondragstart="drag(event)" data-type="downlink-symbol">下行符号</div>
                <div class="block uplink-symbol" draggable="true" ondragstart="drag(event)" data-type="uplink-symbol">上行符号</div>
                <div class="block gp-symbol" draggable="true" ondragstart="drag(event)" data-type="gp-symbol">GP符号</div>
            </div>

            <div style="margin-top: 24px; text-align: right;">
                <button id="configCompleteButton" class="config-complete-button" style="position:static;right:auto;bottom:auto;" onclick="saveAndReturn()">配置完毕</button>
            </div>
        </div>

        <div class="calculator">
            <h2 class="section-title">5G NR TBS 计算器</h2>

            <div class="input-section">
                <div class="input-group">
                    <label class="input-label">
                        MCS Index（调制编码策略指数）
                        <input type="number" class="input-field" value="17" id="mcs-number">
                    </label>
                </div>

                <div class="input-group">
                    <label class="input-label">
                        子载波参数μ
                        <select class="input-field" id="subcarrier-mu">
                            <option value="0">μ=0 (15kHz)</option>
                            <option value="1">μ=1 (30kHz)</option>
                            <option value="2">μ=2 (60kHz)</option>
                            <option value="3">μ=3 (120kHz)</option>
                            <option value="4">μ=4 (240kHz)</option>
                            <option value="5">μ=5 (480kHz)</option>
                        </select>
                    </label>
                </div>

                <div class="input-group">
                    <label class="input-label">
                        v(μ)Layers (maximum number of MIMO layers)
                        <input type="number" class="input-field" value="1" min="1" max="8" id="mimo-layers">
                    </label>
                </div>

                <div class="input-group">
                    <label class="input-label">
                        Nprb (Total number of allocated PRBs for the UE)
                        <input type="number" class="input-field" value="15" min="1" max="273" id="nprb">
                    </label>
                </div>

                <div class="input-group">
                    <label class="input-label">
                        N sh symb (时隙中分配给PDSCH/PUSCH的符号数) 
                        <input type="number" class="input-field" id="scheduled-symbols" readonly style="background:#f0f0f0;">
                    </label>
                </div>

                <div class="input-group">
                    <label class="input-label">
                        N prb dmrs (PRB中用于DMRS的RE数)
                        <input type="number" class="input-field" value="12" min="0" id="dmrs-per-prb">
                    </label>
                </div>

                <div class="input-group">
                    <label class="input-label">
                        N prb oh （PDSCH开销）
                        <input type="number" class="input-field" value="0" min="0" id="overhead">
                    </label>
                </div>

                <div class="input-group">
                    <label class="input-label">
                        Qm （调制阶数）
                        <input type="number" class="input-field" value="6" id="modulation-order">
                    </label>
                </div>

                <div class="input-group">
                    <label class="input-label">
                        R （目标码率）
                        <input type="number" class="input-field" value="438" id="code-rate">
                    </label>
                </div>
                <div class="result-panel" style="border: 2px solid #3498db; background-color: rgba(255, 255, 255, 0.9); border-radius: 10px; padding: 15px; margin-top: 20px;">
                    <h3 style="color: #2c3e50; margin-bottom: 10px;">计算结果</h3>
                    <div class="result-item">
                        N(RE): <span class="result-value" id="nre-result">0</span>
                    </div>
                    <div class="result-item">
                        Ninfo (信息位数): <span class="result-value" id="ninfo-result">0</span>
                    </div>
                    <div class="result-item">
                        5G NR TBS (传输块大小): <span class="result-value" id="tbs-result">0</span>
                    </div>
                    <div class="result-item">
                        计算的最大吞吐量 (Mbps): <span class="result-value" id="throughput-result">0</span>
                    </div>
                </div>
            </div>
        </div>

        <button id="deploymentCompleteButton" class="config-complete-button" style="display: none;" onclick="window.location.href='deploy.html'">部署完毕</button>
    </div>

    <script>
        // ------------------ 通用函数 ------------------
        function allowDrop(ev) {
            ev.preventDefault();
        }

        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.getAttribute('data-type'));
        }

        // 时隙时间轴的拖放（保持原有逻辑）
        function dropSlot(ev) {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text");
            const timeline = ev.target.closest('.timeline');
            if (!timeline || timeline.id !== 'slot-timeline') return;

            const slotTypes = ['downlink-time', 'uplink-time'];
            if (!slotTypes.includes(data)) {
                showToast("只能在时隙时间轴放置时隙类型");
                return;
            }

            const newBlock = document.createElement('div');
            newBlock.className = `block ${data}`;
            newBlock.textContent = data === 'downlink-time' ? '下行' : '上行';

            newBlock.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                if (confirm('确定要删除该时隙区块吗？')) {
                    newBlock.remove();
                    updateSymbolCount(); // 时隙删除不会影响符号数，但保留调用以统一
                }
            });

            const slotCount = parseInt(document.getElementById('slotCount').value);
            const timelineWidth = timeline.offsetWidth;
            const blockWidth = timelineWidth / slotCount;
            newBlock.style.width = `${blockWidth}px`;

            const blocks = Array.from(timeline.children).filter(child => child.classList && child.classList.contains('block'));
            if (blocks.length < slotCount) {
                timeline.appendChild(newBlock);
            } else {
                showToast("时隙槽位已满，请先删除再添加");
            }
        }

        // 符号时间轴的拖放（固定14个槽位，每个槽位独立放置）
        function initSymbolSlots() {
            const symbolTimeline = document.getElementById('symbol-timeline');
            symbolTimeline.innerHTML = '';
            for (let i = 0; i < 14; i++) {
                const slot = document.createElement('div');
                slot.className = 'symbol-slot';
                slot.setAttribute('data-index', i);
                slot.addEventListener('dragover', allowDrop);
                slot.addEventListener('drop', function(e) {
                    e.preventDefault();
                    const data = e.dataTransfer.getData("text");
                    if (!['downlink-symbol', 'uplink-symbol', 'gp-symbol'].includes(data)) return;
                    // 清空当前槽位原有内容
                    slot.innerHTML = '';
                    const symbolDiv = document.createElement('div');
                    symbolDiv.className = `block ${data}`;
                    symbolDiv.textContent = data === 'downlink-symbol' ? '下行' : (data === 'uplink-symbol' ? '上行' : 'GP');
                    // 右键删除
                    symbolDiv.addEventListener('contextmenu', function(ev) {
                        ev.preventDefault();
                        if (confirm('确定要删除该符号吗？')) {
                            slot.innerHTML = '';
                            updateSymbolCount();
                        }
                    });
                    slot.appendChild(symbolDiv);
                    updateSymbolCount();
                });
                symbolTimeline.appendChild(slot);
            }
        }

        // 更新符号统计（每时隙上下行符号数）并联动TBS计算器的符号数输入框
        function updateSymbolCount() {
            const slots = document.querySelectorAll('#symbol-timeline .symbol-slot');
            let uplink = 0, downlink = 0;
            slots.forEach(slot => {
                const block = slot.querySelector('.block');
                if (block) {
                    if (block.classList.contains('uplink-symbol')) uplink++;
                    if (block.classList.contains('downlink-symbol')) downlink++;
                }
            });
            document.getElementById('uplinkSymbolsAuto').textContent = uplink;
            document.getElementById('downlinkSymbolsAuto').textContent = downlink;

            // 更新TBS计算器的符号数输入框（只读，自动计算总符号数）
            const totalSymbols = uplink + downlink;
            const scheduledInput = document.getElementById('scheduled-symbols');
            if (scheduledInput) {
                scheduledInput.value = totalSymbols;
                updateResults(); // 重新计算TBS
            }
        }

        // 更新子帧与时隙时间轴（时隙时间轴重置，符号时间轴保持不变）
        function updateTimelines() {
            const subframeCount = parseInt(document.getElementById('subframeCount').value);
            const slotCount = parseInt(document.getElementById('slotCount').value);

            // 子帧时间轴
            const subframeTimeline = document.getElementById('subframe-timeline');
            subframeTimeline.innerHTML = '';
            for (let i = 0; i < subframeCount; i++) {
                const block = document.createElement('div');
                block.className = 'subframe-block';
                block.style.width = `${100 / subframeCount}%`;
                block.style.height = '100%';
                block.style.float = 'left';
                subframeTimeline.appendChild(block);
            }

            // 时隙时间轴：清空并添加分割线（不预先放置块，由用户拖拽）
            const slotTimeline = document.getElementById('slot-timeline');
            slotTimeline.innerHTML = '';
            for (let i = 1; i < slotCount; i++) {
                const divider = document.createElement('div');
                divider.className = 'timeline-divider';
                divider.style.left = `${(i * 100) / slotCount}%`;
                slotTimeline.appendChild(divider);
            }
            // 符号时间轴已经固定初始化，不再重建（避免丢失配置）
            // 但需确保符号槽位存在（首次加载时调用initSymbolSlots）
            if (document.querySelectorAll('#symbol-timeline .symbol-slot').length === 0) {
                initSymbolSlots();
            }
            updateSymbolCount();
        }

        // 提示信息
        function showToast(message) {
            let toast = document.getElementById('toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'toast';
                document.body.appendChild(toast);
            }
            Object.assign(toast.style, {
                position: 'fixed', top: '80px', left: '50%', transform: 'translateX(-50%)',
                background: 'rgba(114, 116, 154, 0.9)', color: 'white', padding: '10px 20px',
                borderRadius: '4px', zIndex: '1000', transition: 'opacity 0.3s', fontSize: '14px'
            });
            toast.textContent = message;
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 3000);
        }

        // ------------------ TBS 计算 ------------------
        function updateResults() {
            const mcsIndex = parseInt(document.getElementById('mcs-number').value);
            const subcarrierMu = parseInt(document.getElementById('subcarrier-mu').value);
            const nprb = parseInt(document.getElementById('nprb').value);
            const scheduledSymbols = parseInt(document.getElementById('scheduled-symbols').value);
            const dmrsPerPrb = parseInt(document.getElementById('dmrs-per-prb').value);
            const overhead = parseInt(document.getElementById('overhead').value);
            const mimolayers = parseInt(document.getElementById('mimo-layers').value);

            const mcsTable = [
                { Qm: 2, R: 120 }, { Qm: 2, R: 193 }, { Qm: 2, R: 308 }, { Qm: 2, R: 449 },
                { Qm: 2, R: 602 }, { Qm: 2, R: 378 }, { Qm: 2, R: 490 }, { Qm: 2, R: 616 },
                { Qm: 2, R: 466 }, { Qm: 2, R: 567 }, { Qm: 4, R: 438 }, { Qm: 4, R: 466 },
                { Qm: 4, R: 567 }, { Qm: 4, R: 616 }, { Qm: 6, R: 666 }, { Qm: 6, R: 719 },
                { Qm: 6, R: 772 }, { Qm: 6, R: 822 }, { Qm: 6, R: 873 }, { Qm: 6, R: 910 },
                { Qm: 8, R: 948 }
            ];
            let Qm = 6, R = 438;
            if (mcsIndex >= 0 && mcsIndex < mcsTable.length) {
                Qm = mcsTable[mcsIndex].Qm;
                R = mcsTable[mcsIndex].R;
            }
            document.getElementById('modulation-order').value = Qm;
            document.getElementById('code-rate').value = R;

            const nRE1 = scheduledSymbols * 12 - overhead - dmrsPerPrb;
            const nRE = Math.min(156, nRE1) * nprb;
            document.getElementById('nre-result').textContent = nRE;

            const ninfo = nRE * (R / 1024) * Qm;
            document.getElementById('ninfo-result').textContent = ninfo.toFixed(4);

            let tbs;
            if (ninfo <= 3824) {
                const n = Math.max(3, Math.floor(Math.log2(ninfo) - 6));
                const ninfo1 = Math.max(24, Math.pow(2, n) * Math.floor(ninfo / Math.pow(2, n)));
                const tbs_table = [24,32,40,48,56,64,72,80,88,96,104,112,120,128,136,144,152,160,168,176,184,192,208,240,256,272,280,304,320,336,352,368,384,408,432,456,480,504,528,552,576,608,640,672,704,736,768,808,848,928,984,1032,1064,1128,1160,1192,1224,1256,1288,1320,1352,1416,1480,1544,1608,1672,1736,1800,1864,1928,2024,2088,2152,2216,2280,2408,2472,2536,2600,2664,2728,2792,2856,2976,3104,3240,3368,3496,3624,3752,3824];
                tbs = 24;
                for (let i = 0; i < tbs_table.length; i++) {
                    if (ninfo1 >= tbs_table[i]) tbs = tbs_table[i];
                    else break;
                }
            } else {
                const n = Math.floor(Math.log2(ninfo - 24)) - 5;
                const ninfo1 = Math.max(3824, Math.pow(2, n) * Math.round((ninfo - 24) / Math.pow(2, n)));
                if (R <= 256) {
                    const C = Math.floor((ninfo + 24) / 3816);
                    tbs = 8 * C * Math.ceil((ninfo + 24) / (8 * C));
                } else {
                    if (ninfo > 8424) {
                        const C = Math.floor((ninfo + 24) / 8424);
                        tbs = 8 * C * Math.ceil((ninfo + 24) / (8 * C));
                    } else {
                        tbs = 8 * Math.ceil((ninfo + 24) / 8) - 24;
                    }
                }
            }
            document.getElementById('tbs-result').textContent = tbs;
            const throughput = mimolayers * Math.pow(2, subcarrierMu) * tbs * 1000 / 1024 / 1024;
            document.getElementById('throughput-result').textContent = throughput.toFixed(3);
        }

        // ------------------ 保存配置 ------------------
        function saveAndReturn() {
            const selectedStationId = localStorage.getItem('selectedStationId');
            if (!selectedStationId) {
                alert('未找到选中的基站！');
                return;
            }

            const uplinkSymbols = parseInt(document.getElementById('uplinkSymbolsAuto').textContent);
            const downlinkSymbols = parseInt(document.getElementById('downlinkSymbolsAuto').textContent);
            const subframeCount = document.getElementById('subframeCount').value;
            const slotCount = document.getElementById('slotCount').value;

            // 获取时隙配置（时隙时间轴中的块顺序）
            const slotConfig = [];
            const slotTimeline = document.getElementById('slot-timeline');
            Array.from(slotTimeline.children).forEach(child => {
                if (child.classList && child.classList.contains('block')) {
                    if (child.classList.contains('downlink-time')) slotConfig.push('downlink');
                    else if (child.classList.contains('uplink-time')) slotConfig.push('uplink');
                }
            });

            // 获取符号配置（14个槽位，按顺序记录）
            const symbolConfig = [];
            const slots = document.querySelectorAll('#symbol-timeline .symbol-slot');
            slots.forEach(slot => {
                const block = slot.querySelector('.block');
                if (block) {
                    if (block.classList.contains('downlink-symbol')) symbolConfig.push('downlink');
                    else if (block.classList.contains('uplink-symbol')) symbolConfig.push('uplink');
                    else if (block.classList.contains('gp-symbol')) symbolConfig.push('guard');
                    else symbolConfig.push('');
                } else {
                    symbolConfig.push('');
                }
            });

            try {
                let stationsConfig = JSON.parse(localStorage.getItem('stationsConfig') || '[]');
                const stationIndex = stationsConfig.findIndex(station => station.id === selectedStationId);
                if (stationIndex !== -1) {
                    const existingConfig = stationsConfig[stationIndex];
                    stationsConfig[stationIndex] = {
                        ...existingConfig,
                        symbolRatio: { uplink: uplinkSymbols, downlink: downlinkSymbols },
                        subframeCount, slotCount, slotConfig, symbolConfig,
                        lastUpdated: new Date().toISOString()
                    };
                } else {
                    stationsConfig.push({
                        id: selectedStationId,
                        symbolRatio: { uplink: uplinkSymbols, downlink: downlinkSymbols },
                        subframeCount, slotCount, slotConfig, symbolConfig,
                        lastUpdated: new Date().toISOString()
                    });
                }
                localStorage.setItem('stationsConfig', JSON.stringify(stationsConfig));
                console.log('配置已保存');
                setTimeout(() => window.location.replace('./deploy.html'), 100);
            } catch (error) {
                console.error('保存配置时出错:', error);
                alert('保存配置时出错，请重试！');
            }
        }

        // ------------------ 页面初始化和计算模式支持 ------------------
        document.addEventListener('DOMContentLoaded', function () {
            // 固定符号时间轴
            initSymbolSlots();

            // 初始化子帧、时隙时间轴
            updateTimelines();

            // 监听符号配置变化时更新TBS计算器的符号数
            const observer = new MutationObserver(() => updateSymbolCount());
            observer.observe(document.getElementById('symbol-timeline'), { childList: true, subtree: true });

            // 显示当前基站ID
            const selectedStationId = localStorage.getItem('selectedStationId');
            if (selectedStationId) {
                const idSpan = document.getElementById('currentStationId');
                if (idSpan) idSpan.textContent = '当前配置基站ID：' + selectedStationId;
            }

            // 其他输入框变化时更新计算结果
            document.querySelectorAll('.input-field, select').forEach(input => {
                input.addEventListener('change', updateResults);
            });

            // 初始计算一次
            updateResults();

            // 处理跨页面计算模式（从deploy.html调用）
            const urlParams = new URLSearchParams(window.location.search);
            const mode = urlParams.get('mode');
            const requestKey = urlParams.get('requestKey');
            if (mode === 'calculate') {
                const calculationRequest = JSON.parse(localStorage.getItem(requestKey || 'calculationRequest') || '{}');
                if (calculationRequest.status === 'pending') {
                    try {
                        const sinr = calculationRequest.sinr;
                        let mcs;
                        if (sinr >= 27.86) mcs = 15;
                        else if (sinr >= 26.01) mcs = 14;
                        else if (sinr >= 23.41) mcs = 13;
                        else if (sinr >= 20.87) mcs = 12;
                        else if (sinr >= 19.20) mcs = 11;
                        else if (sinr >= 16.93) mcs = 10;
                        else if (sinr >= 14.53) mcs = 9;
                        else if (sinr >= 12.25) mcs = 8;
                        else if (sinr >= 9.85) mcs = 7;
                        else if (sinr >= 8.48) mcs = 6;
                        else if (sinr >= 6.29) mcs = 5;
                        else if (sinr >= 4.14) mcs = 4;
                        else if (sinr >= 0.56) mcs = 3;
                        else if (sinr >= -4.13) mcs = 2;
                        else if (sinr >= -8.51) mcs = 1;
                        else mcs = 1;

                        document.getElementById('mcs-number').value = mcs;
                        document.getElementById('nprb').value = '273';
                        document.getElementById('scheduled-symbols').value = calculationRequest.symbolCount;
                        document.getElementById('dmrs-per-prb').value = '2';
                        document.getElementById('overhead').value = '0';
                        updateResults();

                        const throughput = parseFloat(document.getElementById('throughput-result').textContent);
                        const result = {
                            requestId: calculationRequest.requestId,
                            status: 'completed',
                            achievableRate: throughput
                        };
                        localStorage.setItem('calculationResult', JSON.stringify(result));
                    } catch (error) {
                        localStorage.setItem('calculationResult', JSON.stringify({
                            requestId: calculationRequest.requestId,
                            status: 'error',
                            error: error.message
                        }));
                    }
                }
                // 不继续显示页面内容
                document.body.innerHTML = '<div style="text-align:center;margin-top:50px;">计算完成，窗口可关闭</div>';
                return;
            }
        });
    </script>
</body>
